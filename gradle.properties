# Metaspace raised from 1g: the daemon was exhausting it and restarting between
# builds, which throws away the warm compiler and makes the next build slower.
# Kotlin, KSP, Hilt and R8 each load a lot of classes into the same daemon.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

kotlin.code.style=official
ksp.incremental=true
